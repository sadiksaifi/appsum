[tools]
go = "1.27.3"
golangci-lint = "2.15.0"
node = "24.21.0"
"npm:tagsmith" = { version = "1.2.0", allow_low_downloads = true }
goreleaser = "2.18.3"

[env]
CGO_ENABLED = "0"

[tasks.start]
description = "Run appsum from source"
run = "go run ./cmd/appsum"
raw = true

[tasks.build]
description = "Build the appsum binary"
run = "go build -o bin/appsum ./cmd/appsum"

[tasks."build:all"]
description = "Build macOS and Linux binaries for x86_64 and arm64"
run = [
  "GOOS=darwin GOARCH=amd64 go build -o dist/appsum-darwin-x86_64 ./cmd/appsum",
  "GOOS=darwin GOARCH=arm64 go build -o dist/appsum-darwin-arm64 ./cmd/appsum",
  "GOOS=linux GOARCH=amd64 go build -o dist/appsum-linux-x86_64 ./cmd/appsum",
  "GOOS=linux GOARCH=arm64 go build -o dist/appsum-linux-arm64 ./cmd/appsum",
]

[tasks.install]
description = "Install appsum into ~/.local/bin"
run = 'GOBIN="$HOME/.local/bin" go install ./cmd/appsum'

[tasks.fmt]
description = "Format Go source and imports"
run = "golangci-lint fmt"

[tasks.lint]
description = "Check Go source"
run = "golangci-lint run"

[tasks.test]
description = "Test process-tree grouping and totals"
run = "go test ./..."

[tasks.check]
description = "Run lint and tests"
depends = ["lint", "test"]

[tasks."release:check"]
description = "Validate release configuration"
run = ["tagsmith targets --json", "goreleaser check"]
